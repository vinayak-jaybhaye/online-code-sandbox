services:
  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # ── API Server ───────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        API_PORT: ${API_PORT}
    ports:
      - '${API_PORT}:${API_PORT}'
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy

  # ── Worker ───────────────────────────────────────────────────────────────────
  # NOTE: Docker socket mount is LOCAL DEV ONLY.
  # Production deployments need a more secure container runtime approach.
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy

  # ── Web (Vite Dev Server) ────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_PORT: ${API_PORT}
    ports:
      - '${WEB_PORT}:80'
    depends_on:
      - api

  # ── Sandbox Image Builder ───────────────────────────────────────────────────
  sandbox-builder:
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/sandbox/python:/build
    command: docker build -t sandbox-python /build
    profiles:
      - setup

  sandbox-builder-js:
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/sandbox/javascript:/build
    command: docker build -t sandbox-javascript /build
    profiles:
      - setup

  sandbox-builder-cpp:
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/sandbox/cpp:/build
    command: docker build -t sandbox-cpp /build
    profiles:
      - setup

  sandbox-builder-c:
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/sandbox/c:/build
    command: docker build -t sandbox-c /build
    profiles:
      - setup

  sandbox-builder-java:
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/sandbox/java:/build
    command: docker build -t sandbox-java /build
    profiles:
      - setup
